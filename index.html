<style>
/* Layout: sidebar + content on desktop, sticky tab strip on phone. Calm lavender-white surfaces, one violet accent. */
:root{
  --bg:#F8F7FF; --surface:#FFFFFF; --surface-2:#F3F0FF; --border:#E7E3F6;
  --fg:#1C1B29; --fg-2:#4A4760; --muted:#6B6880;
  --accent:#6D4AFF; --accent-ink:#5A38F0; --accent-soft:#EEE9FF; --accent-mid:#B9A9FF;
  --btn:#6D4AFF; --on-btn:#FFFFFF; --lock-bg:rgba(248,247,255,.55);
  --income:#2F8478; --income-soft:#E3F2EF; --warn:#9A6A12; --warn-soft:#FBF3E2; --gap:#B24F6B; --gap-soft:#FBEAF0;
  --shadow:0 1px 2px rgba(28,27,41,.04),0 6px 20px rgba(60,40,140,.06);
  --f-head:'Manrope','Inter',system-ui,sans-serif; --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13121B; --surface:#1B1A28; --surface-2:#242238; --border:#2D2B44;
  --fg:#EEECFA; --fg-2:#C9C5DE; --muted:#9E9AB8;
  --accent:#8D72FF; --accent-ink:#A895FF; --accent-soft:#2A2550; --accent-mid:#5B47C9;
  --btn:#7B5CFF; --on-btn:#FFFFFF; --lock-bg:rgba(19,18,27,.6);
  --income:#6FC3B5; --income-soft:#1D3A36; --warn:#E0B060; --warn-soft:#3A2F16; --gap:#E08AA3; --gap-soft:#3D2230;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13121B; --surface:#1B1A28; --surface-2:#242238; --border:#2D2B44;
  --fg:#EEECFA; --fg-2:#C9C5DE; --muted:#9E9AB8;
  --accent:#8D72FF; --accent-ink:#A895FF; --accent-soft:#2A2550; --accent-mid:#5B47C9;
  --btn:#7B5CFF; --on-btn:#FFFFFF; --lock-bg:rgba(19,18,27,.6);
  --income:#6FC3B5; --income-soft:#1D3A36; --warn:#E0B060; --warn-soft:#3A2F16; --gap:#E08AA3; --gap-soft:#3D2230;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 14px/1.5 var(--f-body);padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-head);margin:0;letter-spacing:-.01em;text-wrap:balance}
.ic{width:20px;height:20px;flex:none}
.num,.amt,.big{font-variant-numeric:tabular-nums}
.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:232px minmax(0,1fr);gap:32px}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;padding:24px 0}
.brand{display:flex;align-items:center;gap:10px;font:800 18px var(--f-head)}
.brand svg{width:30px;height:30px}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:24px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--fg-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current=page]{background:var(--accent-soft);color:var(--accent-ink)}
.main{min-width:0;padding-bottom:96px}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.top{display:flex;align-items:center;gap:12px;padding:20px 0 12px}
.top h1{font-size:26px;font-weight:800;flex:1;min-width:0}
.top .brand{display:none}
.tabs{display:none}
.ib{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--surface);cursor:pointer}
.ib:hover{background:var(--surface-2)}
@media(max-width:899px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}.side{display:none}
  .top{padding:12px 0 8px}.top h1{font-size:22px}.top .brand{display:flex}.top .brand svg{width:28px;height:28px}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
  .tabs a{flex:none;padding:7px 13px;border-radius:99px;background:var(--surface);border:1px solid var(--border);color:var(--fg-2);text-decoration:none;font-weight:500;font-size:13px}
  .tabs a[aria-current=page]{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-mid)}
}
.view{display:flex;flex-direction:column;gap:16px;padding-top:8px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:16px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:16px;font-weight:700}
.chead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.chead h2{flex:1;min-width:0}
.lbl{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.big{font:800 26px/1.15 var(--f-head);margin-top:4px;overflow-wrap:anywhere}
.sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.muted{color:var(--muted)}.pos{color:var(--income)}.neg{color:var(--gap)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);padding:9px 14px;border-radius:12px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--surface-2)}
a.btn{text-decoration:none;color:var(--fg)}
.btn.pri{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}.btn.danger{color:var(--gap)}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.pill.ok{background:var(--income-soft);color:var(--income)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--gap-soft);color:var(--gap)}.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:500;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 6px;border:0;border-bottom:1px solid var(--border);background:none;text-align:left;cursor:pointer;border-radius:8px}
.row:last-child{border-bottom:0}.row:hover{background:var(--surface-2)}
.row.static{cursor:default}.row.static:hover{background:none}
.r-main{flex:1;min-width:0;display:flex;flex-direction:column}
.r-main b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-main small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:600;white-space:nowrap}.amt.in{color:var(--income)}
.ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--fg-2)}
.ico.in{background:var(--income-soft);color:var(--income)}.ico.tr{background:var(--accent-soft);color:var(--accent-ink)}
.dayhead{font-size:12px;font-weight:600;color:var(--muted);padding:14px 6px 4px;text-transform:uppercase;letter-spacing:.06em}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn>i{background:var(--warn)}.bar.over>i{background:var(--gap)}.bar.ok>i{background:var(--income)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font:700 16px var(--f-head);margin-bottom:4px}
.empty .btn{margin-top:14px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);color:var(--accent-ink);border-radius:14px;padding:12px 16px}
.banner span{flex:1;min-width:200px}
.insight{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.insight:last-child{border-bottom:0}.insight .ic{margin-top:1px;color:var(--accent)}
.insight.warn .ic{color:var(--warn)}.insight.bad .ic{color:var(--gap)}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters .fi{width:auto;flex:1;min-width:130px}
.fi{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--fg)}
.fi:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;min-width:0}.f.half{grid-column:auto}
.f .lab{font-size:12.5px;font-weight:600;color:var(--fg-2)}.hint{color:var(--muted);font-size:12px}
.f.chk{flex-direction:row;align-items:center}
.scrim{position:fixed;inset:0;background:rgba(20,18,35,.5);z-index:60}
.modal{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;background:var(--surface);border-radius:20px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:0}
.m-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}.m-head h2{flex:1;font-size:19px}
.m-foot{display:flex;gap:8px;margin-top:20px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.err{color:var(--gap);margin:12px 0 0;font-weight:500}
@media(max-width:600px){
  .modal{top:auto;bottom:0;left:0;right:0;transform:none;width:auto;max-height:92%;border-radius:20px 20px 0 0;
    padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .fi{font-size:16px}.fgrid{grid-template-columns:1fr}.f.half{grid-column:1/-1}
}
.fab{position:fixed;z-index:40;right:calc(max(16px,env(safe-area-inset-right,0px)));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--btn);color:var(--on-btn);display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 24px rgba(109,74,255,.35)}
.fab .ic{width:26px;height:26px}
.toast{position:fixed;z-index:80;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;max-width:calc(100% - 32px)}
.chart{width:100%}.chart svg{display:block}
.gl{stroke:var(--border);stroke-width:1}.gz{stroke:var(--muted);stroke-width:1;opacity:.6}
.ct{fill:var(--muted);font:11px var(--f-body)}
.sl1{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.sl2{fill:none;stroke:var(--accent-mid);stroke-width:2.5;stroke-linejoin:round;stroke-dasharray:5 4}
.sa{fill:var(--accent-soft);opacity:.7}
.bi{fill:var(--income)}.bo{fill:var(--accent)}.gp{fill:var(--gap);stroke:var(--surface);stroke-width:2}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:12px;align-items:center;padding:6px 0}
.hb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl{overflow-x:auto}.tbl table{border-collapse:collapse;width:100%;min-width:520px}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--border)}
.tbl td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.range{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.range input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.rng-v{font-weight:600}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:18px 24px}
.pv{display:block;width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-bottom:8px}
.gphoto{margin:-20px -20px 16px;aspect-ratio:16/9;overflow:hidden;border-radius:16px 16px 0 0;position:relative;background:var(--surface-2)}
.gphoto img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .4s}
.gbadge{position:absolute;left:12px;bottom:12px;background:rgba(20,18,35,.72);color:#fff;font:700 13px var(--f-body);padding:4px 10px;border-radius:99px;font-variant-numeric:tabular-nums}
.gth{width:32px;height:32px;border-radius:10px;object-fit:cover;flex:none}
body.locked{overflow:hidden}
body.locked .shell,body.locked .fab{filter:blur(16px);pointer-events:none;user-select:none}
.lock{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--lock-bg);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.lock-card{width:min(320px,100%);text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:28px 24px;box-shadow:var(--shadow)}
.lock-card h2{font-size:19px}
.dots{display:flex;gap:14px;justify-content:center;margin:18px 0 6px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent-mid);transition:background .12s}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.pad button{height:56px;border-radius:16px;border:1px solid var(--border);background:var(--surface-2);font:600 20px var(--f-head);cursor:pointer;display:grid;place-items:center}
.pad button:hover{background:var(--accent-soft)}.pad button:active{background:var(--accent-mid)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  <aside class="side"><div class="brand" id="brand-side"></div><nav class="nav" id="nav" aria-label="Разделы"></nav></aside>

<script>
(function(){
'use strict';
const $=(s,el=document)=>el.querySelector(s), $$=(s,el=document)=>[...el.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=s=>{if(typeof s==='number')return s;const x=parseFloat(String(s).replace(/[\s ]/g,'').replace(',','.'));return isFinite(x)?x:NaN};
/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate(),12)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addMonths=(d,n,day)=>{const t=new Date(d.getFullYear(),d.getMonth()+n,1,12);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(day||d.getDate(),last));return t};
const mkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const dim=d=>new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
const fDay=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'});
const fFull=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric'});
const fMon=new Intl.DateTimeFormat('ru-RU',{month:'short'});
const fMonL=new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'});
const dshort=d=>fDay.format(d).replace('.','');
const mlabel=d=>fMon.format(d).replace('.','')+(d.getFullYear()!==today().getFullYear()?' '+String(d.getFullYear()).slice(2):'');
const inDays=d=>{const n=Math.round((d-today())/864e5);return n===0?'сегодня':n===1?'завтра':n<0?(-n)+' дн. назад':'через '+n+' дн.'};
const monthsLeft=d=>Math.max(1,Math.round((d-today())/(30.44*864e5)));
function dayLabel(s){const d=parse(s),n=Math.round((today()-d)/864e5);return n===0?'Сегодня':n===1?'Вчера':fFull.format(d)}
/* ---------- state ---------- */
const KEY='lichny-balans-v1';
const CUR={RUB:'Российский рубль',USD:'Доллар США',EUR:'Евро'};
const EXP_CATS=['Жильё','Продукты','Транспорт','Кафе и рестораны','Здоровье','Одежда','Развлечения','Подписки','Образование','Подарки','Налоги и сборы','Долги и кредиты','Прочее'];
const INC_CATS=['Зарплата','Подработка','Премия','Проценты','Возврат долга','Прочее'];
const ACC_TYPES=[['card','Карта'],['cash','Наличные'],['savings','Накопительный счёт'],['deposit','Вклад'],['broker','Брокерский счёт'],['crypto','Крипто'],['other','Другое']];
const LIQ=new Set(['card','cash','savings']);
const REPEAT=[['none','Не повторяется'],['weekly','Каждую неделю'],['monthly','Каждый месяц'],['yearly','Каждый год']];
const PRIO=[['must','Обязательно'],['should','Желательно'],['nice','По желанию']];

function nextMonthDay(t,day){const c=new Date(t.getFullYear(),t.getMonth(),Math.min(day,dim(t)),12);return c>t?c:addMonths(t,1,day)}
/* ---------- transactions ---------- */
function applyTx(t,sg){
  const A=acc(t.accountId);if(!A)return;
  if(t.type==='income')A.balance+=sg*conv(t.amount,t.currency,A.currency);
  else if(t.type==='expense')A.balance-=sg*conv(t.amount,t.currency,A.currency);
  else if(t.type==='transfer'){const B=acc(t.toAccountId);A.balance-=sg*t.amount;if(B)B.balance+=sg*(t.toAmount>0?t.toAmount:conv(t.amount,A.currency,B.currency))}
}
function nextOcc(d,rep,day){return rep==='weekly'?addDays(d,7):rep==='yearly'?addMonths(d,12,day):addMonths(d,1,day)}
function processRecurring(){
  let n=0;const t=today();
  for(const r of S.recurring){let g=0;while(parse(r.nextDate)<=t&&g++<400){
    const tx={id:uid(),type:r.type,date:r.nextDate,amount:r.amount,currency:r.currency,accountId:r.accountId,toAccountId:r.toAccountId||'',toAmount:r.toAmount||0,category:r.category,note:r.note,tags:r.tags||''};
    S.transactions.push(tx);applyTx(tx,1);r.nextDate=iso(nextOcc(parse(r.nextDate),r.repeat,r.day));n++}}
  if(n){persist();toast('Добавлены повторяющиеся операции: '+n)}
}

function monthStats(k){let inc=0,exp=0;const cats={};
  for(const t of S.transactions){if(t.date.slice(0,7)!==k)continue;
    if(t.type==='income')inc+=toBase(t.amount,t.currency);
    else if(t.type==='expense'){const b=toBase(t.amount,t.currency);exp+=b;cats[t.category]=(cats[t.category]||0)+b}}
  return {inc,exp,cats}}
const lastMonths=n=>{const t=today(),out=[];for(let i=n-1;i>=0;i--)out.push(new Date(t.getFullYear(),t.getMonth()-i,1,12));return out};
const liquidTotal=()=>S.accounts.filter(a=>LIQ.has(a.type)).reduce((s,a)=>s+toBase(a.balance,a.currency),0);
const assetsTotal=()=>S.accounts.reduce((s,a)=>s+toBase(a.balance,a.currency),0)+S.debts.filter(d=>d.kind==='owed').reduce((s,d)=>s+toBase(d.balance,d.currency),0);
const liabTotal=()=>S.debts.filter(d=>d.kind==='owe').reduce((s,d)=>s+toBase(d.balance,d.currency),0);
function occRaw(it,from,to){
  const out=[],start=parse(it.date),rep=it.repeat||'none';
  if(rep==='none'){if(start>=from&&start<=to)out.push(start);return out}
  const dn=start.getDate();let n=0,cur=new Date(start);
  while(cur<=to&&n<800){if(cur>=from)out.push(new Date(cur));n++;cur=rep==='weekly'?addDays(start,7*n):rep==='monthly'?addMonths(start,n,dn):addMonths(start,12*n,dn)}
  return out}
/* Нерабочие дни РФ. Выходные суббота и воскресенье учитываются всегда; ниже будние нерабочие дни по официальным переносам. */
const HOL={2026:['01-01','01-02','01-05','01-06','01-07','01-08','01-09','02-23','03-09','05-01','05-11','06-12','11-04','12-31'],

const FIXH=['01-01','01-02','01-03','01-04','01-05','01-06','01-07','01-08','02-23','03-08','05-01','05-09','06-12','11-04'];
const md=d=>pad(d.getMonth()+1)+'-'+pad(d.getDate());
const wkend=d=>d.getDay()===0||d.getDay()===6;
function isOff(d){
  if(wkend(d))return true;
  const y=d.getFullYear();if(HOL[y])return HOL[y].includes(md(d));
  if(FIXH.includes(md(d)))return true;
  for(let j=1;j<=4;j++){const q=addDays(d,-j);if(!wkend(q)&&!FIXH.includes(md(q)))break;if(wkend(q)&&FIXH.includes(md(q)))return true}
  return false}
function shiftPay(d){let x=new Date(d),g=0;while(isOff(x)&&g++<20)x=addDays(x,-1);return x}
const sameDay=(a,b)=>iso(a)===iso(b);
function occ(it,from,to){
  if(!it.salary)return occRaw(it,from,to);
  return occRaw(it,from,addDays(to,12)).map(shiftPay).filter(d=>d>=from&&d<=to)}
function shiftNote(it,d){
  if(!it.salary||!d)return '';
  const raw=occRaw(it,today(),addDays(today(),830)).find(r=>sameDay(shiftPay(r),d));
  return raw&&!sameDay(raw,d)?' · перенос с '+dshort(raw)+' на '+dshort(d)+' (ст. 136 ТК РФ)':''}
const perMonth=it=>it.repeat==='weekly'?it.amount*52/12:it.repeat==='monthly'?it.amount:it.repeat==='yearly'?it.amount/12:0;
/* ---------- debts ---------- */
function firstPay(d){const t=today();const c=new Date(t.getFullYear(),t.getMonth(),Math.min(d.day||1,dim(t)),12);return c>=t?c:addMonths(t,1,d.day||1)}
function debtSchedule(d,extra){
  extra=extra||0;const r=(d.rate||0)/1200,pay=(d.monthly||0)+extra;let b=d.balance;
  if(pay<=0||pay<=b*r)return {rows:[],months:Infinity,interest:Infinity,never:true};
  const rows=[];let tot=0;
  while(b>0.5&&rows.length<600){const int=b*r,p=Math.min(pay,b+int);b=b+int-p;tot+=int;rows.push({p,int,b})}
  return {rows,months:rows.length,interest:tot,never:false}}
function oweActive(){return S.debts.filter(d=>d.kind==='owe'&&d.balance>0&&d.monthly>0)}
const topRate=list=>list.length?list.reduce((a,b)=>b.rate>a.rate?b:a):null;
/* ---------- baseline spending ---------- */
function plannedMonthly(){return S.expenses.reduce((s,e)=>s+toBase(perMonth(e),e.currency),0)}
function debtMonthly(){return oweActive().reduce((s,d)=>s+toBase(d.monthly,d.currency),0)}
function avgExpenses(){const ms=lastMonths(4).slice(0,3).map(d=>monthStats(mkey(d)).exp).filter(x=>x>0);return ms.length?ms.reduce((a,b)=>a+b,0)/ms.length:0}
function baselineOther(){const a=avgExpenses();return a?Math.max(0,a-plannedMonthly()-debtMonthly()):0}
function monthlyNeeds(){return avgExpenses()||(plannedMonthly()+debtMonthly())}
/* ---------- events (next N days) ---------- */
function upcoming(days){
  const t=today(),to=addDays(t,days),ev=[];
  for(const i of S.incomes)for(const d of occ(i,t,to))ev.push({date:d,kind:'in',name:i.name,amount:toBase(i.amount,i.currency),possible:i.certain===false});
  for(const e of S.expenses)for(const d of occ(e,t,to))ev.push({date:d,kind:'out',name:e.name,amount:toBase(e.amount,e.currency),must:e.priority==='must'});
  for(const d of oweActive()){const s=debtSchedule(d),f=firstPay(d);
    s.rows.forEach((r,i)=>{const dt=addMonths(f,i,d.day);if(dt<=to)ev.push({date:dt,kind:'debt',name:'Платёж: '+d.name,amount:toBase(r.p,d.currency)})})}
  for(const d of S.debts.filter(x=>x.kind==='owed'&&x.balance>0&&x.monthly>0)){const f=firstPay(d);const dt=f;if(dt<=to)ev.push({date:dt,kind:'in',name:'Возврат: '+d.name,amount:toBase(Math.min(d.monthly,d.balance),d.currency),possible:true})}
  return ev.sort((a,b)=>a.date-b.date)}
/* ---------- forecast ---------- */
function forecast(o){
  const t=today(),N=o.months,frac0=(dim(t)-t.getDate()+1)/dim(t);
  const keys=[],dates=[];for(let i=0;i<N;i++){const d=new Date(t.getFullYear(),t.getMonth()+i,1,12);keys.push(mkey(d));dates.push(d)}
  const B={};keys.forEach(k=>B[k]={inc:0,exp:0,debt:0});

  for(const d of owe){const s=debtSchedule(d,d===tg?fromBase(o.extraDebt,d.currency):0),f=firstPay(d);
    s.rows.forEach((r,i)=>{const b=B[mkey(addMonths(f,i,d.day))];if(b)b.debt+=toBase(r.p,d.currency)})}

    if(gap<0&&bal<0)gap=i});
  return {rows,gap,start:liquidTotal()}}

function barSvg(W,H,sp){

function blobSave(name,data){
  const type=/\.json$/.test(name)?'application/json':'text/csv';
  const u=URL.createObjectURL(new Blob([data],{type:type+';charset=utf-8'}));
  const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Файл сохранён')}
async function saveFile(name,data){
  if(!(window.claude&&window.claude.use)){try{blobSave(name,data)}catch(e){toast('Не удалось сохранить файл')}return}
  try{const d=await window.claude.use('downloads');if(!d){toast('Сохранение файлов здесь недоступно');return}
    await d.save({filename:name,data});toast('Файл сохранён')}
  catch(e){if(!e||e.code!=='declined')toast('Не удалось сохранить файл')}}
function exportCsv(){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';

  S.transactions.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(t=>rows.push([t.date,{income:'Доход',expense:'Расход',transfer:'Перевод'}[t.type],String(t.amount).replace('.',','),t.currency,(acc(t.accountId)||{}).name||'',(acc(t.toAccountId)||{}).name||'',t.category,t.note,t.tags]));
  saveFile('operations.csv','﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n'))}

  const allC=[...new Set(Object.keys(cur.cats).concat(Object.keys(prev.cats)))].map(c=>({c,a:cur.cats[c]||0,b:prev.cats[c]||0})).sort((x,y)=>Math.abs(y.a-y.b)-Math.abs(x.a-x.b)).slice(0,6);
  const top=S.transactions.filter(t=>t.type==='expense'&&t.date.slice(0,7)===sel).sort((a,b)=>toBase(b.amount,b.currency)-toBase(a.amount,a.currency)).slice(0,5);
  return '<div class="card"><div class="chead"><h2>Доходы и расходы по месяцам</h2></div><div class="legend"><span><i style="background:var(--income)"></i>Доходы</span><span><i style="background:var(--accent)"></i>Расходы</span></div>'
   +chartBox('an-bars',{type:'bar',labels:months.map(d=>mlabel(d)),series:[{vals:stats.map(s=>s.inc),cls:'bi',name:'Доходы'},{vals:stats.map(s=>s.exp),cls:'bo',name:'Расходы'}],label:'Доходы и расходы за шесть месяцев'},230)
   +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">'+months.map((d,i)=>{const s=stats[i];return '<span class="pill '+(s.inc>0&&s.inc>s.exp?'ok':'')+'" title="Норма сбережений">'+mlabel(d)+': '+(s.inc>0?Math.round((s.inc-s.exp)/s.inc*100)+' %':'—')+'</span>'}).join('')+'</div><div class="sub">Пилюли — норма сбережений: доля дохода, которая осталась после расходов.</div></div>'
   +'<div class="card"><div class="chead"><h2>Расходы по категориям</h2><select class="fi" data-an="month" aria-label="Месяц" style="width:auto">'+months.slice().reverse().map(d=>'<option value="'+mkey(d)+'"'+(mkey(d)===sel?' selected':'')+'>'+fMonL.format(d)+'</option>').join('')+'</select></div>'
   +(cats.length?cats.map(([c,v])=>'<div class="hb"><span class="nm">'+esc(c)+'</span><div class="bar"><i style="width:'+pct(v,mx)+'%"></i></div><span class="amt">'+money(v)+'</span></div>').join(''):empty('Расходов нет','В этом месяце расходов не было.'))+'</div>'
   +'<div class="g2"><div class="card"><div class="chead"><h2>Сравнение с прошлым месяцем</h2></div>'+(allC.length?allC.map(x=>{const dl=x.a-x.b;return '<div class="row static"><span class="r-main"><b>'+esc(x.c)+'</b><small>'+money(x.b)+' → '+money(x.a)+'</small></span><span class="amt '+(dl>0?'neg':'pos')+'">'+(dl>0?'+':'−')+money(Math.abs(dl))+'</span></div>'}).join(''):empty('Нет данных','Для сравнения нужны расходы.'))+'</div>'
   +'<div class="card"><div class="chead"><h2>Крупнейшие траты месяца</h2></div>'+(top.length?top.map(t=>'<button class="row" data-act="edit-tx" data-id="'+t.id+'"><span class="r-main"><b>'+esc(t.category)+'</b><small>'+dshort(parse(t.date))+(t.note?' · '+esc(t.note):'')+'</small></span><span class="amt">'+money(t.amount,t.currency)+'</span></button>').join(''):empty('Трат нет','В этом месяце расходов не было.'))+'</div></div>'};
/* ---------- PIN lock ---------- */
let locked=false,pinBuf='',fails=0,lockUntil=0,hiddenAt=0,verifying=false;
const PLKEY='lichny-balans-pinlock';
try{const r=JSON.parse(localStorage.getItem(PLKEY)||'null');if(r){fails=r.fails||0;lockUntil=r.until||0}}catch(e){}
function savePL(){try{localStorage.setItem(PLKEY,JSON.stringify({fails,until:lockUntil}))}catch(e){}}
async function hashPin(pin,salt){
  const enc=new TextEncoder();
  try{if(window.crypto&&crypto.subtle){const k=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:60000,hash:'SHA-256'},k,256);
    return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let h=5381;const s=salt+pin;for(let r=0;r<5000;r++)for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'f'+h}
async function verifyPin(pin){const p=S.settings.pin;return !!p&&(await hashPin(pin,p.salt))===p.hash}
function drawLock(){
  $('#lock-root').innerHTML='<div class="lock" role="dialog" aria-modal="true" aria-labelledby="lk-t"><div class="lock-card"><div style="width:44px;height:44px;margin:0 auto 12px">'+MARK+'</div><h2 id="lk-t">Введите ПИН-код</h2><div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div><p class="err" id="lk-msg" style="min-height:22px;margin:4px 0" role="alert"></p><div class="pad">'
   +[1,2,3,4,5,6,7,8,9].map(n=>'<button type="button" data-k="'+n+'" aria-label="'+n+'">'+n+'</button>').join('')+'<span></span><button type="button" data-k="0" aria-label="0">0</button><button type="button" data-k="back" aria-label="Стереть">'+ic('back')+'</button></div><p class="sub" style="margin-top:14px">Забыли ПИН-код? Сбросить его можно только очисткой данных сайта в браузере, вместе с данными приложения.</p></div></div>'}
function updLock(msg){$$('#lock-root .dots i').forEach((d,i)=>d.classList.toggle('on',i<pinBuf.length));const m=$('#lk-msg');if(m)m.textContent=msg||''}
function setInert(v){['.shell','.fab','#modal-root'].forEach(s=>{const e=$(s);if(e){if(v)e.setAttribute('inert','');else e.removeAttribute('inert')}})}
function showLock(){
  if(!S.settings.pin)return;if(modalOpen())closeModal();
  locked=true;pinBuf='';verifying=false;document.body.classList.add('locked');setInert(true);drawLock();
  const b=$('#lock-root .pad button');if(b)b.focus()}
function unlock(){locked=false;pinBuf='';fails=0;lockUntil=0;savePL();verifying=false;document.body.classList.remove('locked');setInert(false);$('#lock-root').innerHTML=''}
function pinKey(k){
  if(!locked||verifying)return;
  if(Date.now()<lockUntil){updLock('Слишком много попыток. Подождите '+Math.ceil((lockUntil-Date.now())/1000)+' с.');return}
  if(k==='back')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=k;
  updLock('');
  if(pinBuf.length<4)return;
  verifying=true;
  verifyPin(pinBuf).then(ok=>{
    if(!locked)return;
    if(ok){unlock();return}
    verifying=false;pinBuf='';fails++;
    const c=$('#lock-root .lock-card');if(c){c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
    if(fails%5===0){const w=Math.min(600000,30000*Math.pow(2,fails/5-1));lockUntil=Date.now()+w;savePL();updLock('Слишком много попыток. Подождите '+Math.round(w/1000)+' с.')}else{savePL();updLock('Неверный ПИН-код. Попыток до паузы: '+(5-fails%5))}})}
function pinForm(mode){
  const f=[];
  if(mode!=='set')f.push({k:'cur',t:'pin',label:'Текущий ПИН-код',req:1});
  if(mode!=='off'){f.push({k:'p1',t:'pin',label:'Новый ПИН-код',hint:'4 цифры',req:1});f.push({k:'p2',t:'pin',label:'Повторите ПИН-код',req:1})}
  openForm({title:mode==='set'?'Установить ПИН-код':mode==='change'?'Изменить ПИН-код':'Отключить ПИН-код',values:{cur:'',p1:'',p2:''},fields:f,saveLabel:mode==='off'?'Отключить':'Сохранить',
    onSave:async o=>{
      if(mode!=='set'&&!(await verifyPin(o.cur)))return 'Текущий ПИН-код неверный';
      if(mode==='off'){delete S.settings.pin;persist();render();toast('ПИН-код отключён');return}
      if(!/^\d{4}$/.test(o.p1))return 'ПИН-код должен состоять из 4 цифр';
      if(o.p1!==o.p2)return 'ПИН-коды не совпадают';
      const salt=uid();S.settings.pin={salt:salt,hash:await hashPin(o.p1,salt)};persist();render();
      toast(mode==='set'?'ПИН-код установлен':'ПИН-код изменён')}})}
$('#lock-root').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)pinKey(b.dataset.k)});
/* ---------- shell ---------- */
const PAGES=[['overview','Обзор','home'],['operations','Операции','list'],['accounts','Счета','wallet'],['debts','Долги','landmark'],['income','Поступления','down'],['expenses','Плановые траты','up'],['goals','Цели','target'],['forecast','Прогноз','trend'],['budgets','Бюджеты','gauge'],['analytics','Аналитика','bars']];
const TITLES={overview:'Обзор',operations:'Операции',accounts:'Счета и накопления',debts:'Долги и кредиты',income:'Будущие поступления',expenses:'Будущие расходы',goals:'Цели и накопления',forecast:'Прогноз и сценарии',budgets:'Бюджеты',analytics:'Аналитика'};
let page='overview';
function route(){const h=location.hash.slice(1);const np=PAGES.some(p=>p[0]===h)?h:'overview';const ch=np!==page;page=np;render();if(ch)window.scrollTo(0,0)}
function render(){
  if(!S)return;
  $('#nav').innerHTML=PAGES.map(p=>'<a href="#'+p[0]+'"'+(p[0]===page?' aria-current="page"':'')+'>'+ic(p[2])+'<span>'+p[1]+'</span></a>').join('');
  $('#tabs').innerHTML=PAGES.map(p=>'<a href="#'+p[0]+'"'+(p[0]===page?' aria-current="page"':'')+'>'+p[1]+'</a>').join('');
  $('#ptitle').textContent=TITLES[page];
  $('#lock-btn').hidden=!S.settings.pin;
  $('#view').innerHTML=pages[page]();
  const cur=$('#tabs [aria-current]');if(cur&&cur.scrollIntoView)try{cur.scrollIntoView({block:'nearest',inline:'center'})}catch(e){}
  drawCharts()}
const byId=(arr,id)=>arr.find(x=>x.id===id);
const ACT={
  'add-tx':()=>txForm(),'edit-tx':id=>txForm(byId(S.transactions,id)),'edit-rec':id=>recForm(byId(S.recurring,id)),
  'add-acc':()=>accForm(),'edit-acc':id=>accForm(byId(S.accounts,id)),
  'add-debt':()=>debtForm(),'edit-debt':id=>debtForm(byId(S.debts,id)),
  'add-inc':()=>incForm(),'edit-inc':id=>incForm(byId(S.incomes,id)),
  'add-exp':()=>expForm(),'edit-exp':id=>expForm(byId(S.expenses,id)),
  'add-goal':()=>goalForm(),'edit-goal':id=>goalForm(byId(S.goals,id)),
  'add-budget':(id,el)=>budgetForm(null,el.dataset.cat),'edit-budget':id=>budgetForm(byId(S.budgets,id)),
  'settings':()=>settings(),'lock':()=>showLock(),'fresh':()=>startFresh(),
  'demo-hide':()=>{S.demoHidden=true;persist();render()},
  'more-ops':()=>{UI.ops.limit+=60;$('#ops-list').innerHTML=opsList()},
  'fc-h':(id,el)=>{if(!FC)FC=fcDefault();FC.months=Number(el.dataset.m);FC.oneOffMonth=Math.min(FC.oneOffMonth,FC.months);render()}};
document.addEventListener('click',e=>{
  if(locked||modalOpen())return;
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=ACT[el.dataset.act];if(!f)return;
  if(el.dataset.id&&el.dataset.act.startsWith('edit')&&!(f.length&&true)){}
  f(el.dataset.id,el)});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.filter){const k=t.dataset.filter;UI.ops[k]=t.value;UI.ops.limit=60;if(k!=='q')return;$('#ops-list').innerHTML=opsList()}
  else if(t.dataset.ui==='extraDebt'){const x=num(t.value);UI.extraDebt=x>0?x:0;$('#debt-out').innerHTML=debtOut();drawCharts()}
  else if(t.dataset.fc&&(t.type==='range'||t.id==='oo'))fcSet(t)});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.filter&&t.dataset.filter!=='q'){UI.ops[t.dataset.filter]=t.value;UI.ops.limit=60;$('#ops-list').innerHTML=opsList()}
  else if(t.dataset.fc&&t.type!=='range'&&t.id!=='oo')fcSet(t);
  else if(t.dataset.an==='month'){UI.anMonth=t.value;render()}});
function fcSet(t){
  if(!FC)FC=fcDefault();const k=t.dataset.fc;
  if(k==='possible')FC.possible=t.checked;
  else if(k==='oneOff'){const x=num(t.value);FC.oneOff=x>0?x:0}
  else FC[k]=Number(t.value);
  const out=$('[data-out="'+k+'"]');if(out)out.textContent=k==='spendPct'?(FC.spendPct>0?'+':'')+FC.spendPct+' %':money(FC[k]);
  $('#fc-out').innerHTML=fcOut();drawCharts()}
document.addEventListener('keydown',e=>{
  if(locked){if(/^[0-9]$/.test(e.key)){e.preventDefault();pinKey(e.key)}else if(e.key==='Backspace'){e.preventDefault();pinKey('back')}return}
  if(e.key==='Escape'&&modalOpen()){closeModal();return}
  if((e.key==='n'||e.key==='т')&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!modalOpen()){const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;e.preventDefault();txForm()}});
window.addEventListener('hashchange',route);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  if(S&&S.settings.pin&&!locked&&hiddenAt&&Date.now()-hiddenAt>=60000)showLock();
  if(S&&!locked){processRecurring();render()}});
/* ---------- init ---------- */
S=load();
if(!S){S=demoState();persist()}
applyTheme();processRecurring();
$('#brand-side').innerHTML=MARK+'<span>Личный баланс</span>';
$('#brand-top').innerHTML=MARK;
$('[data-act="settings"]').innerHTML=ic('sliders');
$('.fab').innerHTML=ic('plus');
$('#lock-btn').innerHTML=ic('lock');
route();
if(S.settings.pin)showLock();
})();
</script>

  if('serviceWorker' in navigator&&location.protocol!=='file:'){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
  }
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
